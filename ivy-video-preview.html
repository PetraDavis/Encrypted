<title>Ivy's Rhythm Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one laptop-style media player window, centred; canvas video on top, transport bar below. Single dark look by choice. */
:root{
  --desk:#0f1014; --chrome:#22242c; --chrome-hi:#2e313b; --line:#3a3e4a;
  --ink:#e6e7ee; --muted:#9093a3; --accent:#ff6fae; --rec:#ff4b4b;
  --font-ui:"Atkinson Hyperlegible",system-ui,sans-serif;
  --font-pix:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
body{background:var(--desk);color:var(--ink);font-family:var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.win{max-width:980px;margin:0 auto;background:var(--chrome);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px #0008}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--chrome-hi);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#555a66;display:block}
.dots i:first-child{background:#e0605a}.dots i:nth-child(2){background:#e0b44a}.dots i:nth-child(3){background:#5fbf62}
.fname{flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;cursor:pointer}
.ctl{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
.scrub{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
button,select{font:inherit;font-size:13px;background:var(--chrome-hi);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{min-width:74px;font-weight:700}
.sp{flex:1}
.frame{font-family:var(--font-pix);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dev{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#key{margin-top:4px;font-family:var(--font-pix);font-size:12px;display:flex;flex-wrap:wrap;gap:4px}
#key button{font-family:var(--font-pix);padding:4px 7px}
.note{max-width:980px;margin:12px auto 0;font-size:12px;color:var(--muted)}
</style>

<div class="win">
  <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="fname">ivy_game_demo_FINAL(2).mp4 — Media Player</span></div>
  <canvas id="cv" width="960" height="540" aria-label="Found video: Ivy demonstrates her rhythm game"></canvas>
  <div class="ctl">
    <div class="scrub"><span id="tc">0:00.00</span><input id="seek" type="range" min="0" max="106" step="0.0001" value="0" aria-label="Scrub"><span>1:46.00</span></div>
    <div class="row">
      <button id="back" title="Previous frame (,)">&#9664;| Frame</button>
      <button id="play">Play</button>
      <button id="fwd" title="Next frame (.)">Frame |&#9654;</button>
      <select id="speed" aria-label="Playback speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option></select>
      <button id="mute">Sound on</button>
      <span class="frame" id="fr">FRAME 0000</span>
      <span class="sp"></span>
      <label class="dev"><input type="checkbox" id="ans"> Answer key (dev)</label>
    </div>
    <div id="key" hidden></div>
  </div>
</div>
<p class="note">Space play/pause · , and . step one frame · 24 fps</p>

<script>
(()=>{
const FPS=24, DUR=106, BPM=120, SPB=60/BPM;
const cv=document.getElementById('cv'), g=cv.getContext('2d'), W=960,H=540;
const TAU=Math.PI*2, R=Math.PI/180;
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const lerp=(a,b,x)=>a+(b-a)*x;
const noise1=t=>Math.sin(t)*.5+Math.sin(t*2.13+1.3)*.3+Math.sin(t*4.7+2.1)*.2;

// ---------- semaphore, as seen by the viewer (canvas degrees, y down)
const D={S:90,SW:135,W:180,NW:225,N:270,NE:315,E:0,SE:45};
const SEM={A:['SW','S'],B:['W','S'],C:['NW','S'],D:['N','S'],E:['S','NE'],F:['S','E'],G:['S','SE'],H:['W','SW'],I:['NW','SW'],J:['N','E'],K:['SW','N'],L:['SW','NE'],M:['SW','E'],N:['SW','SE'],O:['NW','W'],P:['W','N'],Q:['W','NE'],R:['W','E'],S:['W','SE'],T:['NW','N'],U:['NW','NE'],V:['N','SE'],W:['NE','E'],X:['NE','SE'],Y:['NW','E'],Z:['SE','E']};
const MSG="SHEHEARSYOUTHROUGHTHESCREENSDONTMAKEASOUND";
const WORDS="SHE HEARS YOU THROUGH THE SCREENS DONT MAKE A SOUND";
const PERF=[];{let b=16;const gap=[4,3,5,4,4,3,5,4];for(let i=0;i<MSG.length;i++){PERF.push(b);b+=gap[i%8];}}
const notes=[];
let rs=7; const rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;
for(let b=8;b<184;b++){const pi=PERF.indexOf(b);notes.push({b,lane:Math.floor(rnd()*4),j:pi>=0?'PERFECT':(rnd()<.7?'GREAT':'GOOD'),pi});
  if(((b>=48&&b<80)||(b>=112&&b<144)||b>=160)&&rnd()<.35&&pi<0)notes.push({b:b+.5,lane:Math.floor(rnd()*4),j:'GREAT',pi:-1});}
notes.sort((a,b)=>a.b-b.b);
const poses=PERF.map((b,i)=>({t0:b*SPB,t1:(b+1)*SPB,ch:MSG[i]}));
const poseAt=t=>poses.find(p=>t>=p.t0&&t<p.t1);
const SUBS=[[0.6,3.6,"Hi! Okay so... I made this game!"],[4.0,6.4,"Isn't it so cool?!"],[7.0,10.8,"I coded the whole thing myself. Like, all of it."],[11.6,14.6,"Her name's Pip. I drew her too."],[16.2,19.6,"watch, watch, this part's my favorite"],[20.6,24.2,"see how she poses when you get a perfect?"],[25.8,30.2,"I didn't even program that part. She just started doing it."],[31,34.6,"Mom says I spend too long on the computer"],[35.5,39.2,"but she doesn't get it. it's a whole song."],[41,44,"okay the chorus is the best part"],[47,51.6,"I keep hearing the song when the laptop's off. Like humming."],[53.5,56,"that's normal, right? haha"],[60,63,"okay I'm not great at this part"],[66,69,"she's really fast tonight"],[72,76.4,"hold on, the poses are different from how I made them"],[78,81.4,"...whatever. it still looks cool."],[86.6,89.2,"wait. did you hear that?"],[90.2,92,"..."],[93.5,96,"[door creaks]"],[97,99.5,"...mom?"],[101.5,104,"[static]"]];
const GLITCH=new Set([205,206,531,760,1034,1290,1517,1518,1777,1960,2071,2150,2230,2231,2290,2360,2401,2402,2440]);

// ---------- offscreen helpers
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const bigNoise=mk(480,270);{const x=bigNoise.getContext('2d'),id=x.createImageData(480,270);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}x.putImageData(id,0,0);}

// ---------- stage
const crowd=Array.from({length:22},(_,i)=>({x:i*30+hash(i)*14-10,h:40+hash(i+3)*26,ph:hash(i+7)*TAU,stick:hash(i+11)<.55,c:hash(i+13)<.5?'#ff5fb8':'#5fe8ff'}));
function stage(t){
  const beat=t/SPB, pulse=Math.pow(1-(beat%1),3), dim=t>92?1-0.55*ease((t-92)/7):1;
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b0620');bg.addColorStop(.55,'#24104a');bg.addColorStop(1,'#120826');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  // LED wall
  const cols=34,rows=12,cw=18,ox=4,oy=46;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const v=Math.sin(x*.35+t*2.2)+Math.cos(y*.5-t*1.6)+Math.sin((x+y)*.2+beat*Math.PI);
    const hue=(260+v*40+t*20)%360, l=(20+18*(v+3)/6+pulse*14)*dim;
    g.fillStyle=`hsl(${hue},90%,${l}%)`;g.fillRect(ox+x*cw,oy+y*cw,cw-5,cw-5);}
  const fade=g.createLinearGradient(0,oy,0,oy+rows*cw);fade.addColorStop(0,'rgba(11,6,32,.85)');fade.addColorStop(.5,'rgba(11,6,32,.35)');fade.addColorStop(1,'rgba(20,8,40,.9)');
  g.fillStyle=fade;g.fillRect(0,oy-4,620,rows*cw+8);
  // truss
  g.fillStyle='#1a1428';g.fillRect(0,22,620,10);
  for(let i=0;i<12;i++){g.strokeStyle='#2c2440';g.lineWidth=2;g.beginPath();g.moveTo(i*54,22);g.lineTo(i*54+27,32);g.lineTo(i*54+54,22);g.stroke();}
  // beams
  g.save();g.globalCompositeOperation='lighter';
  const bc=['255,95,184','95,232,255','255,214,102','176,120,255'];
  for(let i=0;i<5;i++){const x=60+i*125, a=Math.sin(t*.9+i*1.7)*.45+(i-2)*.08, len=520;
    const ex=x+Math.sin(a)*len, ey=32+Math.cos(a)*len, c=bc[i%4], wdt=60+pulse*30;
    const gr=g.createLinearGradient(x,32,ex,ey);gr.addColorStop(0,`rgba(${c},${.38*dim})`);gr.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=gr;g.beginPath();g.moveTo(x-4,32);g.lineTo(ex-wdt*Math.cos(a),ey+wdt*Math.sin(a));g.lineTo(ex+wdt*Math.cos(a),ey-wdt*Math.sin(a));g.lineTo(x+4,32);g.fill();
    g.fillStyle=`rgba(${c},${.9*dim})`;g.shadowColor=`rgb(${c})`;g.shadowBlur=18;g.beginPath();g.arc(x,32,5,0,TAU);g.fill();g.shadowBlur=0;}
  // haze
  for(let i=0;i<3;i++){const hx=150+i*170+Math.sin(t*.3+i)*40;const hz=g.createRadialGradient(hx,330,10,hx,330,220);hz.addColorStop(0,`rgba(180,120,255,${.10*dim})`);hz.addColorStop(1,'rgba(180,120,255,0)');g.fillStyle=hz;g.fillRect(0,100,620,440);}
  g.restore();
  // floor
  const fl=g.createLinearGradient(0,392,0,540);fl.addColorStop(0,'#2a1650');fl.addColorStop(1,'#0c0618');g.fillStyle=fl;g.fillRect(0,392,620,148);
  g.strokeStyle='rgba(255,95,184,.35)';g.lineWidth=1;
  for(let i=-6;i<=6;i++){g.beginPath();g.moveTo(310+i*40,392);g.lineTo(310+i*140,540);g.stroke();}
  for(let j=0;j<5;j++){const y=392+Math.pow(j/5,1.6)*148+((beat%1)*8*(j+1)/5);g.strokeStyle=`rgba(95,232,255,${.25-j*.03})`;g.beginPath();g.moveTo(0,y);g.lineTo(620,y);g.stroke();}
  const sp=g.createRadialGradient(300,425,5,300,425,150);sp.addColorStop(0,`rgba(255,240,255,${(.35+pulse*.2)*dim})`);sp.addColorStop(1,'rgba(255,240,255,0)');
  g.save();g.globalCompositeOperation='lighter';g.fillStyle=sp;g.beginPath();g.ellipse(300,425,170,40,0,0,TAU);g.fill();g.restore();
}
function crowdLayer(t){
  const beat=t/SPB;
  for(const c of crowd){const jump=Math.max(0,Math.sin(beat*Math.PI*2+c.ph))*6, y=540-c.h+jump*-1;
    if(c.stick){g.save();g.strokeStyle=c.c;g.lineWidth=4;g.lineCap='round';g.shadowColor=c.c;g.shadowBlur=12;
      const a=-90+Math.sin(beat*Math.PI+c.ph)*28;g.beginPath();g.moveTo(c.x+8,y+8);g.lineTo(c.x+8+Math.cos(a*R)*26,y+8+Math.sin(a*R)*26);g.stroke();g.restore();}
    g.fillStyle='#07040f';g.beginPath();g.arc(c.x,y,13,0,TAU);g.fill();g.beginPath();g.roundRect(c.x-19,y+10,38,80,14);g.fill();}
}

// ---------- Pip
function glowStick(x,y,a,col){
  const ex=x+Math.cos(a*R)*50, ey=y+Math.sin(a*R)*50;
  g.save();g.lineCap='round';
  g.strokeStyle='#1d1b26';g.lineWidth=8;g.beginPath();g.moveTo(x-Math.cos(a*R)*6,y-Math.sin(a*R)*6);g.lineTo(x+Math.cos(a*R)*6,y+Math.sin(a*R)*6);g.stroke();
  g.globalCompositeOperation='lighter';g.shadowColor=col;g.shadowBlur=26;g.strokeStyle=col;g.lineWidth=10;
  g.beginPath();g.moveTo(x+Math.cos(a*R)*6,y+Math.sin(a*R)*6);g.lineTo(ex,ey);g.stroke();
  g.shadowBlur=8;g.strokeStyle='#ffffff';g.lineWidth=3.5;g.beginPath();g.moveTo(x+Math.cos(a*R)*8,y+Math.sin(a*R)*8);g.lineTo(ex,ey);g.stroke();
  g.restore();
}
function arm(sx,sy,a1,a2,col){
  const L1=34,L2=32;
  const ex=sx+Math.cos(a1*R)*L1,ey=sy+Math.sin(a1*R)*L1,hx=ex+Math.cos(a2*R)*L2,hy=ey+Math.sin(a2*R)*L2;
  g.lineCap='round';
  g.strokeStyle='#f4f2fb';g.lineWidth=13;g.beginPath();g.moveTo(sx,sy);g.lineTo(ex,ey);g.stroke();
  g.strokeStyle='#ff5fb8';g.lineWidth=3;g.beginPath();g.moveTo(lerp(sx,ex,.75),lerp(sy,ey,.75));g.lineTo(ex,ey);g.stroke();
  g.strokeStyle='#ffd9c4';g.lineWidth=9;g.beginPath();g.moveTo(ex,ey);g.lineTo(hx,hy);g.stroke();
  g.fillStyle='#ffd9c4';g.beginPath();g.arc(hx,hy,6,0,TAU);g.fill();
  return [hx,hy,a2,col];
}
function star(x,y,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.fill();}
function pip(t){
  const beat=t/SPB, ph=beat%1, p=poseAt(t);
  // legs: a key stance on every beat (same timing as the arms), blended in the last quarter of the beat
  const lkb=Math.floor(beat), ltr=ease((ph-0.75)/0.25);
  const LK=b=>{const m=Math.floor(b/4)%6, w=b%2?1:-1;
    switch(m){
      case 0: return {x:w*6,y:0,l:[w<0?-30:-16,w<0?14:0],r:[w>0?30:16,w>0?14:0]};
      case 1: return {x:0,y:w>0?-4:0,l:w<0?[-46,46]:[-16,0],r:w>0?[46,46]:[16,0]};
      case 2: return {x:0,y:w<0?14:2,l:[-30,0],r:[30,0]};
      case 3: return {x:w*20,y:4,l:[w*20-22,0],r:[w*20+22,0]};
      case 4: return {x:0,y:w<0?-18:4,l:[-14,w<0?14:0],r:[14,w<0?14:0]};
      default:return {x:w*4,y:6,l:[w<0?-12:-24,w<0?26:0],r:[w>0?12:24,w>0?26:0]};
    }};
  const L0=LK(lkb),L1=LK(lkb+1),mixv=(a,b)=>lerp(a,b,ltr);
  const cx=300, bob=mixv(L0.y,L1.y)+Math.sin(ph*Math.PI)*2, sway=mixv(L0.x,L1.x);
  const by=258+bob, bx=cx+sway;
  g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(cx+sway*.5,424,62,10,0,0,TAU);g.fill();
  const leg=(hx,hy,fx,fy,out)=>{const A=40,B=40;let dx=fx-hx,dy=fy-14-hy,d=Math.hypot(dx,dy);if(d>A+B-1){const k=(A+B-1)/d;dx*=k;dy*=k;d=A+B-1;}
    const ax=hx+dx,ay=hy+dy,h=Math.sqrt(Math.max(0,A*A-d*d/4)),mx=hx+dx/2,my=hy+dy/2,kx=mx+(dy/d)*h*out,ky=my-(dx/d)*h*out*.3;
    const lg=g.createLinearGradient(hx-8,0,hx+8,0);lg.addColorStop(0,'#ffd9c4');lg.addColorStop(1,'#eab59c');g.strokeStyle=lg;g.lineWidth=12;g.lineCap='round';g.lineJoin='round';
    g.beginPath();g.moveTo(hx,hy);g.lineTo(kx,ky);g.lineTo(ax,ay);g.stroke();
    g.fillStyle='#f4f2fb';g.beginPath();g.roundRect(ax-10,ay-12,20,26,6);g.fill();g.fillStyle='#ff5fb8';g.fillRect(ax-10,ay-10,20,3);g.fillStyle='#2a2440';g.beginPath();g.roundRect(ax-12,ay+10,26,9,4);g.fill();};
  const lf=[mixv(L0.l[0],L1.l[0]),mixv(L0.l[1],L1.l[1])], rf=[mixv(L0.r[0],L1.r[0]),mixv(L0.r[1],L1.r[1])];
  leg(bx-12,by+74,cx+lf[0]+sway*.6,414-lf[1],-1);leg(bx+12,by+74,cx+rf[0]+sway*.6,414-rf[1],1);
  // skirt
  const sk=g.createLinearGradient(0,by+38,0,by+82);sk.addColorStop(0,'#2b2f7a');sk.addColorStop(1,'#1a1c4a');g.fillStyle=sk;
  g.beginPath();g.moveTo(bx-22,by+38);g.lineTo(bx+22,by+38);g.lineTo(bx+40+sway*.3,by+80);g.lineTo(bx-40+sway*.3,by+80);g.closePath();g.fill();
  g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=2;for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(bx+i*6,by+40);g.lineTo(bx+i*12+sway*.3,by+79);g.stroke();}
  g.save();g.shadowColor='#5fe8ff';g.shadowBlur=10;g.strokeStyle='#5fe8ff';g.lineWidth=2.5;g.beginPath();g.moveTo(bx-40+sway*.3,by+79);g.lineTo(bx+40+sway*.3,by+79);g.stroke();g.restore();
  // torso
  const tg=g.createLinearGradient(bx-24,0,bx+24,0);tg.addColorStop(0,'#ffffff');tg.addColorStop(1,'#d9d4ee');g.fillStyle=tg;
  g.beginPath();g.roundRect(bx-23,by-8,46,50,[14,14,8,8]);g.fill();
  g.fillStyle='#ff5fb8';g.beginPath();g.moveTo(bx-9,by-8);g.lineTo(bx,by+10);g.lineTo(bx+9,by-8);g.closePath();g.fill();
  g.fillStyle='#ffd666';star(bx,by+20,6);
  g.save();g.shadowColor='#ff5fb8';g.shadowBlur=8;g.strokeStyle='#ff5fb8';g.lineWidth=2;g.beginPath();g.moveTo(bx-23,by+36);g.lineTo(bx+23,by+36);g.stroke();g.restore();
  // arms: key pose on every beat, move into the next key in the last quarter of the beat
  const kb=Math.floor(beat), tr=ease((ph-0.75)/0.25);
  const K=b=>{const pp=PERF.indexOf(b);if(pp>=0){const s=SEM[MSG[pp]];return [[D[s[0]],D[s[0]]],[D[s[1]],D[s[1]]]];}
    const m=Math.floor(b/4)%4, w=b%2?1:-1;
    const mv=[[[150+w*25,110+w*40],[30-w*25,70-w*40]],[[200+w*20,250],[100,40+w*30]],[[120,200+w*30],[60,-20-w*30]],[[160-w*15,300+w*15],[20+w*15,-120-w*15]]];return mv[m];};
  const lA=(a,b,x)=>{const d=((b-a)%360+540)%360-180;return a+d*x;};
  const k0=K(kb),k1=K(kb+1);
  const aL=[lA(k0[0][0],k1[0][0],tr),lA(k0[0][1],k1[0][1],tr)],aR=[lA(k0[1][0],k1[1][0],tr),lA(k0[1][1],k1[1][1],tr)];
  // head
  const hx=bx,hy=by-48, tilt=Math.sin(beat*Math.PI)*.06;
  g.save();g.translate(hx,hy);g.rotate(tilt);
  const hair=g.createLinearGradient(0,-50,0,40);hair.addColorStop(0,'#b79bff');hair.addColorStop(1,'#6d4fd0');
  g.fillStyle=hair;
  g.beginPath();g.arc(-34,-30,15,0,TAU);g.arc(34,-30,15,0,TAU);g.fill(); // buns
  g.beginPath();g.ellipse(0,-2,42,42,0,0,TAU);g.fill();
  g.beginPath();g.moveTo(-40,0);g.quadraticCurveTo(-50,40,-34,58);g.lineTo(-24,30);g.closePath();g.fill();
  g.beginPath();g.moveTo(40,0);g.quadraticCurveTo(50,40,34,58);g.lineTo(24,30);g.closePath();g.fill();
  const sk2=g.createRadialGradient(-6,4,4,0,8,36);sk2.addColorStop(0,'#fff0e6');sk2.addColorStop(1,'#f1c1a8');
  g.fillStyle=sk2;g.beginPath();g.moveTo(-31,0);g.quadraticCurveTo(-32,34,0,40);g.quadraticCurveTo(32,34,31,0);g.quadraticCurveTo(0,-14,-31,0);g.fill();
  g.fillStyle=hair;g.beginPath();g.moveTo(-40,4);g.quadraticCurveTo(-30,-40,10,-38);g.quadraticCurveTo(38,-34,40,6);g.quadraticCurveTo(30,-6,20,-2);g.lineTo(14,-14);g.lineTo(6,0);g.lineTo(-4,-12);g.lineTo(-14,2);g.quadraticCurveTo(-26,-4,-40,4);g.fill();
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2.5;g.beginPath();g.arc(0,-6,34,-2.6,-1.9);g.stroke();
  g.fillStyle='#ffd666';g.save();g.shadowColor='#ffd666';g.shadowBlur=10;star(26,-22,8);g.restore();
  // eyes
  const blink=(beat%9)<0.1;
  for(const s of [-1,1]){const ex=s*13,ey=12;
    if(blink){g.strokeStyle='#2b1d4d';g.lineWidth=2.5;g.beginPath();g.arc(ex,ey-2,7,.3,Math.PI-.3);g.stroke();continue;}
    g.fillStyle='#fff';g.beginPath();g.ellipse(ex,ey,7.5,10,0,0,TAU);g.fill();
    const ir=g.createLinearGradient(0,ey-10,0,ey+10);ir.addColorStop(0,'#2a2a6a');ir.addColorStop(.6,'#2fb3c9');ir.addColorStop(1,'#9ff3ff');
    g.fillStyle=ir;g.beginPath();g.ellipse(ex,ey+1,6,8.5,0,0,TAU);g.fill();
    g.fillStyle='#14102a';g.beginPath();g.ellipse(ex,ey+1,2.6,4,0,0,TAU);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(ex-2.5,ey-3.5,2.4,0,TAU);g.arc(ex+2.5,ey+4,1.2,0,TAU);g.fill();
    g.strokeStyle='#2b1d4d';g.lineWidth=2.5;g.beginPath();g.ellipse(ex,ey,8,10.5,0,Math.PI*1.1,Math.PI*1.9);g.stroke();}
  g.fillStyle='rgba(255,120,160,.45)';g.beginPath();g.ellipse(-21,24,6,3.5,0,0,TAU);g.ellipse(21,24,6,3.5,0,0,TAU);g.fill();
  g.fillStyle='#b8445e';g.beginPath();if(p){g.ellipse(0,28,4,4,0,0,TAU);}else{g.arc(0,25,4,.15,Math.PI-.15);}g.fill();
  g.restore();
  // glow sticks are drawn last, after both arms, so they are never hidden by the body
  const gs=[arm(bx-24,by,aL[0],aL[1],'#ff5fb8'),arm(bx+24,by,aR[0],aR[1],'#5fe8ff')];gs.forEach(q=>glowStick(...q));
}

// ---------- note highway (perspective) + particles
const LC=['#ff5fb8','#5fe8ff','#ffd666','#9dff8a'];
const HX=790, HZ=70, HIT=460, LOOK=2.2;
function proj(lane,d){const s=1/(1+d*3.2);const y=HZ+(HIT-HZ)*s;const half=150*s;return {x:HX-half+(lane+.5)*(half*2/4),y,s};}
function highway(t){
  g.save();
  const hw=g.createLinearGradient(0,HZ,0,H);hw.addColorStop(0,'rgba(10,6,28,.2)');hw.addColorStop(1,'rgba(10,6,28,.85)');
  const top=proj(0,1),tw=150*top.s;
  g.fillStyle=hw;g.beginPath();g.moveTo(HX-tw,top.y);g.lineTo(HX+tw,top.y);g.lineTo(HX+170,H);g.lineTo(HX-170,H);g.closePath();g.fill();
  for(let i=0;i<=4;i++){const a=proj(i-.5,1),b=proj(i-.5,0);g.strokeStyle='rgba(180,160,255,.25)';g.lineWidth=1.5;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x+(b.x-HX)*.0,b.y);g.lineTo(HX+(b.x-HX)*1.13,H);g.stroke();}
  // beat rungs
  const beat=t/SPB;
  for(let k=0;k<6;k++){const d=((Math.ceil(beat)+k)*SPB-t)/LOOK;if(d<0||d>1)continue;const a=proj(-.5,d),b=proj(3.5,d);g.strokeStyle=`rgba(255,255,255,${.12*(1-d)})`;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
  // receptors
  for(let i=0;i<4;i++){const q=proj(i,0);let lit=0;for(const n of notes){const age=t-n.b*SPB;if(n.lane===i&&age>=0&&age<.18)lit=1-age/.18;}
    g.shadowColor=LC[i];g.shadowBlur=10+lit*30;g.strokeStyle=LC[i];g.lineWidth=3;g.beginPath();g.ellipse(q.x,q.y,30,11,0,0,TAU);g.stroke();
    if(lit){g.globalCompositeOperation='lighter';const rg=g.createRadialGradient(q.x,q.y,0,q.x,q.y,60);rg.addColorStop(0,LC[i]);rg.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=lit*.8;g.fillStyle=rg;g.fillRect(q.x-60,q.y-140,120,160);g.globalAlpha=1;g.globalCompositeOperation='source-over';}}
  g.shadowBlur=0;
  // notes
  for(let ni=notes.length-1;ni>=0;ni--){const n=notes[ni];const d=(n.b*SPB-t)/LOOK;if(d<0||d>1)continue;const q=proj(n.lane,d),w=58*q.s,h=18*q.s;
    g.shadowColor=LC[n.lane];g.shadowBlur=16*q.s;const ng=g.createLinearGradient(0,q.y-h/2,0,q.y+h/2);ng.addColorStop(0,'#fff');ng.addColorStop(.35,LC[n.lane]);ng.addColorStop(1,LC[n.lane]);
    g.globalAlpha=Math.min(1,(1-d)*3);g.fillStyle=ng;g.beginPath();g.roundRect(q.x-w/2,q.y-h/2,w,h,h/2);g.fill();g.globalAlpha=1;}
  g.shadowBlur=0;
  // particles from recent hits (deterministic so scrubbing works)
  g.globalCompositeOperation='lighter';
  for(const n of notes){const age=t-n.b*SPB;if(age<0||age>.7)continue;const q=proj(n.lane,0),cnt=n.j==='PERFECT'?34:16;
    for(let i=0;i<cnt;i++){const a=-Math.PI*(.1+.8*hash(n.b*31+i)),sp=120+hash(n.b*17+i)*220;
      const px=q.x+Math.cos(a)*sp*age,py=q.y+Math.sin(a)*sp*age+260*age*age,al=1-age/.7;
      g.fillStyle=n.j==='PERFECT'?`rgba(255,230,140,${al})`:LC[n.lane];g.globalAlpha=n.j==='PERFECT'?1:al;g.beginPath();g.arc(px,py,2.2*(1-age),0,TAU);g.fill();}}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  // judgement
  let last=null;for(const n of notes){if(n.b*SPB<=t)last=n;}
  if(last){const age=t-last.b*SPB;if(age<.5){const sc=age<.08?1.35-age*4.4:1, al=age>.35?1-(age-.35)/.15:1;
    g.save();g.translate(HX,300-age*16);g.scale(sc,sc);g.globalAlpha=al;g.textAlign='center';
    const txt=last.j==='PERFECT'?'PERFECT!':last.j;g.font=`${last.j==='PERFECT'?38:28}px Silkscreen,monospace`;
    if(last.j==='PERFECT'){const tg=g.createLinearGradient(0,-30,0,4);tg.addColorStop(0,'#fff6c8');tg.addColorStop(1,'#ffb347');g.fillStyle=tg;g.shadowColor='#ffb347';}else{g.fillStyle=last.j==='GREAT'?'#8ff0ff':'#d8d0f0';g.shadowColor=g.fillStyle;}
    g.shadowBlur=22;g.fillText(txt,0,0);g.restore();}}
  g.restore();
}
function hud(t){
  let score=0,combo=0;for(const n of notes){if(n.b*SPB>t)break;score+=n.j==='PERFECT'?1000:n.j==='GREAT'?600:300;combo++;}
  g.save();
  g.fillStyle='rgba(8,4,24,.55)';g.beginPath();g.roundRect(842,14,104,74,10);g.fill();
  g.textAlign='right';g.fillStyle='#bfb6e6';g.font='11px Silkscreen,monospace';g.fillText('SCORE',934,32);
  g.fillStyle='#fff';g.shadowColor='#ff5fb8';g.shadowBlur=10;g.font='19px Silkscreen,monospace';g.fillText(String(score).padStart(7,'0'),934,54);
  g.shadowBlur=0;g.fillStyle='#ffd666';g.font='12px Silkscreen,monospace';g.fillText(combo+' COMBO',934,76);
  // song card
  g.textAlign='left';g.fillStyle='rgba(8,4,24,.55)';g.beginPath();g.roundRect(14,10,220,44,10);g.fill();
  const ag=g.createLinearGradient(22,16,54,48);ag.addColorStop(0,'#ff5fb8');ag.addColorStop(1,'#5fe8ff');g.fillStyle=ag;g.beginPath();g.roundRect(22,16,32,32,6);g.fill();
  g.fillStyle='#fff';star(38,32,9);
  g.fillStyle='#fff';g.font='13px Silkscreen,monospace';g.fillText('STARLIGHT STEP',62,30);
  g.fillStyle='#bfb6e6';g.font='10px Silkscreen,monospace';g.fillText('PIP DANCE!! v0.3 · by ivy',62,45);
  // progress
  g.fillStyle='rgba(255,255,255,.12)';g.fillRect(14,60,220,4);const pg=g.createLinearGradient(14,0,234,0);pg.addColorStop(0,'#ff5fb8');pg.addColorStop(1,'#5fe8ff');g.fillStyle=pg;g.fillRect(14,60,220*Math.min(1,t/(DUR-1.5)),4);
  g.restore();
}

function subtitle(t){
  const s=SUBS.find(s=>t>=s[0]&&t<s[1]);if(!s)return;
  g.font='600 21px "Atkinson Hyperlegible",sans-serif';g.textAlign='center';
  const w=g.measureText(s[2]).width+28, x=560;g.fillStyle='rgba(0,0,0,.72)';g.beginPath();g.roundRect(x-w/2,486,w,34,6);g.fill();
  g.fillStyle='#fff';g.fillText(s[2],x,510);
}
function staticNoise(a,f){g.save();g.globalAlpha=a;g.drawImage(bigNoise,(f*37)%200-200,(f*53)%100-100,W*1.5,H*1.5);g.restore();}
function render(t){
  const f=Math.round(t*FPS);
  if(t>=DUR-1.5){g.fillStyle='#000';g.fillRect(0,0,W,H);staticNoise(Math.max(0,1-(t-(DUR-1.5))*1.1),f);
    g.fillStyle='#888';g.font='14px Silkscreen,monospace';g.textAlign='center';g.fillText('[ recording stopped ]',W/2,H/2);return;}
  stage(t);pip(t);crowdLayer(t);highway(t);hud(t);
  if(t>92){g.fillStyle=`rgba(0,0,0,${.35*ease((t-92)/8)})`;g.fillRect(0,0,W,H);}
  if(t>87){const fl=hash(f*1.7)>(t>93?.55:.85);if(fl){g.fillStyle=`rgba(0,0,0,${t>93?.8:.55})`;g.fillRect(0,0,W,H);}}
  subtitle(t);
  if(GLITCH.has(f)){staticNoise(.8,f);g.fillStyle='rgba(255,255,255,.2)';for(let i=0;i<6;i++)g.fillRect(0,hash(f+i)*H,W,3);
    g.drawImage(cv,0,200,W,60,18,200,W,60);}
  if(showKey){const p=poseAt(t);if(p){g.save();g.fillStyle='#00ff88';g.shadowColor='#000';g.shadowBlur=6;g.font='40px Silkscreen,monospace';g.textAlign='center';g.fillText(p.ch,300,110);
    g.font='12px Silkscreen,monospace';g.fillText('DEV: semaphore '+SEM[p.ch].join(' / '),300,128);g.restore();}}
}

// ---------- audio: original track "Starlight Step", 120 BPM
let ac=null,bus=null,rev=null,dly=null,lp=null,muted=false,nextStep=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[[57,60,64],[53,57,60],[48,52,55,60],[55,59,62]]; // Am F C G
const ROOT=[45,41,48,43];
const VERSE=[[69,null,72,74,76,null,74,72],[72,null,69,null,65,67,69,null],[67,null,72,76,79,null,76,72],[74,null,71,74,79,77,79,null]];
const CHORUS=[[81,79,76,79,81,null,84,null],[81,79,77,null,72,74,77,79],[79,76,72,76,79,null,84,83],[81,null,79,null,74,76,79,null]];
function initAudio(){
  ac=new AudioContext();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=18000;lp.connect(comp);
  bus=ac.createGain();bus.gain.value=.8;bus.connect(lp);
  rev=ac.createConvolver();const len=ac.sampleRate*2.2,ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  rev.buffer=ir;const rg=ac.createGain();rg.gain.value=.35;rev.connect(rg).connect(lp);
  dly=ac.createDelay(1);dly.delayTime.value=SPB*.75;const fb=ac.createGain();fb.gain.value=.33;const df=ac.createBiquadFilter();df.type='lowpass';df.frequency.value=3000;
  dly.connect(df).connect(fb).connect(dly);const dg=ac.createGain();dg.gain.value=.3;df.connect(dg).connect(lp);
}
function voice(when,{type='sine',f,dur,vol,rv=0,dl=0,cut=0,glide=0,attack=.005}){
  const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,when);if(glide)o.frequency.exponentialRampToValueAtTime(glide,when+dur);
  gn.gain.setValueAtTime(0,when);gn.gain.linearRampToValueAtTime(vol,when+attack);gn.gain.exponentialRampToValueAtTime(.0001,when+dur);
  let node=o;if(cut){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);node=fl;}
  node.connect(gn);gn.connect(bus);
  if(rv){const s=ac.createGain();s.gain.value=rv;gn.connect(s).connect(rev);}
  if(dl){const s=ac.createGain();s.gain.value=dl;gn.connect(s).connect(dly);}
  o.start(when);o.stop(when+dur+.05);
}
let nb=null;function noiseBuf(){if(nb)return nb;nb=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return nb;}
function noise(when,dur,vol,type,freq,rv=0){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=noiseBuf();f.type=type;f.frequency.value=freq;
  gn.gain.setValueAtTime(vol,when);gn.gain.exponentialRampToValueAtTime(.0001,when+dur);s.connect(f).connect(gn).connect(bus);if(rv){const r=ac.createGain();r.gain.value=rv;gn.connect(r).connect(rev);}s.start(when);s.stop(when+dur+.02);}
const kick=w=>voice(w,{f:150,glide:42,dur:.32,vol:.9});
const snare=w=>{noise(w,.18,.45,'bandpass',1800,.4);voice(w,{type:'triangle',f:220,glide:150,dur:.1,vol:.25});};
const hat=(w,open)=>noise(w,open?.22:.05,open?.14:.1,'highpass',7500);
const detune=t=>t<92?1:1-0.24*ease((t-92)/8);
function step(i,when,st){
  const bar=Math.floor(i/16), s16=i%16, ci=bar%4, k=detune(st), late=st>=92;
  const sec=bar<4?'intro':bar<12?'verse':bar<20?'chorus':bar<28?'verse':bar<36?'chorus':bar<40?'bridge':'chorus';
  const sp=1/speed;
  if(late){ // the song falls apart: sparse, detuned, darker
    if(s16%8===0)voice(when,{type:'sawtooth',f:mf(ROOT[ci])*k,dur:1.2*sp,vol:.12,cut:500});
    if(s16===0)for(const m of CHORDS[ci])voice(when,{type:'triangle',f:mf(m)*k*.995,dur:2.2*sp,vol:.05,rv:.9,attack:.3});
    if(s16%4===0){const n=VERSE[ci][s16/2];if(n)voice(when,{type:'square',f:mf(n)*k,dur:.5*sp,vol:.03,cut:1400,rv:.8,dl:.6});}
    return;}
  // drums
  if(sec!=='intro'){if(s16%4===0)kick(when);if(s16===4||s16===12)snare(when);if(sec==='chorus'&&s16===14)snare(when);}
  if(s16%2===1)hat(when,sec==='chorus'&&s16%4===3);else if(sec!=='intro'&&sec!=='bridge')hat(when,false);
  // pad
  if(s16===0)for(const m of CHORDS[ci]){voice(when,{type:'sawtooth',f:mf(m)*1.003,dur:2*sp,vol:.028,cut:sec==='intro'?900:2200,rv:.6,attack:.08});voice(when,{type:'sawtooth',f:mf(m)*.997,dur:2*sp,vol:.028,cut:sec==='intro'?900:2200,attack:.08});}
  // bass
  if(sec!=='intro'&&s16%2===0){const oct=s16%4===2?12:0;voice(when,{type:'sawtooth',f:mf(ROOT[ci]+oct-12),dur:.2*sp,vol:.22,cut:700});voice(when,{type:'sine',f:mf(ROOT[ci]-12),dur:.22*sp,vol:.25});}
  // arp
  if((sec==='intro'||sec==='bridge'||sec==='chorus')&&true){const ch=CHORDS[ci],n=ch[s16%ch.length]+12;voice(when,{type:'triangle',f:mf(n),dur:.12*sp,vol:sec==='chorus'?.035:.06,dl:.5,rv:.2});}
  // lead
  if((sec==='verse'||sec==='chorus')&&s16%2===0){const mel=(sec==='verse'?VERSE:CHORUS)[ci][s16/2];
    if(mel){voice(when,{type:'square',f:mf(mel),dur:.22*sp,vol:.05,cut:3200,dl:.45,rv:.25});voice(when,{type:'sawtooth',f:mf(mel)*1.006,dur:.22*sp,vol:.025,cut:2400});}}
}
function scheduleAudio(){
  if(!ac||muted||!playing)return;
  const stp=SPB/4, horizon=vt+0.2*speed;
  lp.frequency.setTargetAtTime(vt<92?18000:Math.max(600,18000-(vt-92)*3000),ac.currentTime,.3);
  while(nextStep*stp<horizon){const st=nextStep*stp;
    if(st>=vt-0.02&&st<DUR-1.6)step(nextStep,ac.currentTime+Math.max(0,(st-vt)/speed),st);nextStep++;}
  if(vt>=93.5&&vt<93.7&&!blipped.has('creak')){blipped.add('creak');const w=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),gn=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(70,w);o.frequency.linearRampToValueAtTime(140,w+.6);o.frequency.linearRampToValueAtTime(55,w+1.6);
    f.type='bandpass';f.frequency.value=900;f.Q.value=6;gn.gain.setValueAtTime(0,w);gn.gain.linearRampToValueAtTime(.35,w+.2);gn.gain.linearRampToValueAtTime(.0001,w+1.8);
    o.connect(f).connect(gn).connect(bus);const rs=ac.createGain();rs.gain.value=.5;gn.connect(rs).connect(rev);o.start(w);o.stop(w+1.9);}
  // gentle voice blips per word while Ivy talks
  for(const s of SUBS){if(s[2]==='...'||s[2][0]==='[')continue;const words=[];let pos=0;for(const w of s[2].split(' ')){words.push(s[0]+pos/14);pos+=w.length+1;}
    words.forEach((wt,j)=>{const key=s[0]*100+j;if(vt>=wt&&vt<wt+.15&&!blipped.has(key)){blipped.add(key);voice(ac.currentTime,{type:'sine',f:520+hash(key)*220,glide:480+hash(key+1)*160,dur:.07,vol:.05});}});}
}
let blipped=new Set();
function resetAudioCursor(){nextStep=Math.ceil(vt/(SPB/4));blipped=new Set(vt>93.6?['creak']:[]);for(const s of SUBS){let pos=0;s[2].split(' ').forEach((w,j)=>{if(s[0]+pos/14<vt)blipped.add(s[0]*100+j);pos+=w.length+1;});}}

// ---------- player
let vt=0,playing=false,speed=1,showKey=false,lastTs=0;
const $=id=>document.getElementById(id);
const fmt=t=>`${Math.floor(t/60)}:${(t%60).toFixed(2).padStart(5,'0')}`;
function sync(){$('seek').value=vt;$('tc').textContent=fmt(vt);$('fr').textContent='FRAME '+String(Math.round(vt*FPS)).padStart(4,'0');$('play').textContent=playing?'Pause':'Play';}
function draw(){render(vt);sync();}
function setT(t){vt=Math.max(0,Math.min(DUR,t));resetAudioCursor();draw();}
function toggle(){if(!ac){try{initAudio();}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  if(vt>=DUR)setT(0);playing=!playing;resetAudioCursor();lastTs=performance.now();sync();}
function loop(ts){if(playing){vt+=(ts-lastTs)/1000*speed;if(vt>=DUR){vt=DUR;playing=false;}scheduleAudio();draw();}lastTs=ts;requestAnimationFrame(loop);}
$('play').onclick=toggle;cv.onclick=toggle;
$('fwd').onclick=()=>{playing=false;setT((Math.round(vt*FPS)+1)/FPS);};
$('back').onclick=()=>{playing=false;setT((Math.round(vt*FPS)-1)/FPS);};
$('seek').oninput=e=>setT(+e.target.value);
$('speed').onchange=e=>{speed=+e.target.value;resetAudioCursor();};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';};
$('ans').onchange=e=>{showKey=e.target.checked;$('key').hidden=!showKey;draw();};
$('key').innerHTML=`<span style="flex-basis:100%;color:var(--ink)">${WORDS}</span>`+poses.map(p=>`<button data-t="${p.t0}">${p.ch} @ ${fmt(p.t0)}</button>`).join('');
$('key').onclick=e=>{const b=e.target.closest('button');if(b){playing=false;setT(+b.dataset.t+0.01);}};
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();toggle();}else if(e.key===',')$('back').click();else if(e.key==='.')$('fwd').click();});
window.__ivy={setT,poses,SEM};
document.fonts?.ready.then(draw);
setT(1.2);requestAnimationFrame(loop);
})();
</script>
